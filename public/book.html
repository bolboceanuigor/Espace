<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rezervare</title>
<meta name="description" content="Rezervă direct, fără comision.">
<meta name="theme-color" content="#1b2a2f">
<link rel="icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
/* A company's own booking page. Palette: Chișinău limestone and Moldovan wine; the availability strip is the one bold element. */
:root{
  --stone:#eef0ec; --paper:#ffffff; --ink:#1b2a2f; --muted:#66727a; --line:#dde1dc;
  --wine:#8a1f3d; --wine-ink:#ffffff; --wine-soft:#f6e7ec; --free:#2f7a4d; --free-soft:#e3f1e8; --busy:#c9ced1;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root{--stone:#121a1d;--paper:#1a2428;--ink:#edf1ef;--muted:#9aa6ab;--line:#2a363b;--wine:#e0718f;--wine-ink:#1a0d12;--wine-soft:#3a1f28;--free:#6fcf97;--free-soft:#1d3427;--busy:#3a4549}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--stone);color:var(--ink);font:16px/1.55 "Golos Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--wine);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}

header{padding:28px 0 18px}
.top{display:flex;align-items:center;gap:12px}
.lang{margin-left:auto;display:flex;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:none;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
h1{font-family:Unbounded,"Golos Text",sans-serif;font-weight:700;font-size:clamp(30px,6vw,52px);line-height:1.05;letter-spacing:-.02em;margin:26px 0 10px;max-width:16ch}
.intro{font-size:18px;color:var(--muted);margin:0;max-width:60ch}
.contact{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-weight:600}
.contact a{text-decoration:none;border-bottom:2px solid var(--line)}.contact a:hover{border-color:var(--wine)}

/* search: dates and guests */
.search{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--stone) 88%,transparent);backdrop-filter:blur(10px);padding:12px 0;margin-top:8px}
.sbox{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.sf{display:flex;flex-direction:column;padding:4px 10px;border-radius:10px}
.sf:focus-within{background:var(--stone)}
.sf label{font-size:12.5px;color:var(--muted);font-weight:500}
.sf input{border:0;background:none;padding:2px 0;font-weight:600;font-size:16px;min-width:0;width:100%}
.sf input:focus{outline:none}
.guests{display:flex;align-items:center;gap:6px;padding:0 6px}
.guests span{display:flex;flex-direction:column;align-items:center;min-width:56px}
.guests small{font-size:12.5px;color:var(--muted)}
.guests b{font-size:16px}
.stp{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-size:18px;font-weight:600;cursor:pointer}
.stp:disabled{opacity:.35;cursor:default}
.summary{margin:10px 2px 0;font-size:14.5px;color:var(--muted);min-height:1.4em}
@media (max-width:640px){.sbox{grid-template-columns:1fr 1fr}.guests{grid-column:1/-1;justify-content:space-between;padding:6px 10px;border-top:1px solid var(--line)}}
@media (max-width:640px){.sbox{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.sf{min-width:0}.sf input{min-width:0;width:100%;box-sizing:border-box}.guests{gap:2px;padding:6px 2px;min-width:0}.guests .stp{width:38px;height:38px;flex:none}.guests span{min-width:0;flex:1}}

/* units */
main{padding:6px 0 60px}
.unit{display:grid;grid-template-columns:240px 1fr;gap:20px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:14px}
.unit.off{opacity:.62}
.ph{aspect-ratio:4/3;border-radius:12px;background:var(--stone);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:13px}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ub{display:flex;flex-direction:column;min-width:0}
.uh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.uh h2{font-size:21px;line-height:1.2;margin:0;font-weight:700}
.uh .kind{color:var(--muted);font-size:14px}
.facts{margin:6px 0 0;color:var(--ink);font-size:15px}
.am{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.am span{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--stone);color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin-top:14px}
.strip i{height:26px;border-radius:6px;background:var(--free-soft);position:relative;display:flex;align-items:flex-end;justify-content:center;font-style:normal;font-size:10.5px;color:var(--free);font-weight:600;padding-bottom:2px}
.strip i.b{background:var(--busy);color:transparent}
.strip i.sel{box-shadow:inset 0 0 0 2px var(--wine)}
.strip i.b.sel{background:repeating-linear-gradient(135deg,var(--busy) 0 4px,var(--wine-soft) 4px 8px)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.uf{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:auto;padding-top:14px;flex-wrap:wrap}
.price b{font-size:22px;font-weight:700}.price span{color:var(--muted);font-size:14px}
.price small{display:block;color:var(--muted);font-size:14px}
.go{border:0;border-radius:12px;background:var(--wine);color:var(--wine-ink);font-weight:700;padding:12px 20px;font-size:16px;cursor:pointer}
.go:disabled{background:var(--busy);color:var(--muted);cursor:default}
.why{font-size:14px;color:var(--muted)}
.why button{border:0;background:none;padding:0;color:var(--wine);font-weight:600;cursor:pointer;text-decoration:underline}
@media (max-width:640px){.unit{grid-template-columns:1fr}.strip i{font-size:9.5px}}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:18px;padding:28px;text-align:center;color:var(--muted);margin-top:14px}
.terms{margin-top:26px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.terms h3{margin:0 0 6px;font-size:16px}.terms p{margin:0;white-space:pre-line;color:var(--muted)}
footer{padding:26px 0 40px;color:var(--muted);font-size:13.5px;text-align:center}
footer a{color:var(--muted)}

/* request sheet */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,18,20,.45)}
.sheet[hidden]{display:none}
.sh{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom))}
@media (min-width:700px){.sheet{align-items:center}.sh{border-radius:22px}}
@media (prefers-reduced-motion:no-preference){.sh{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}}}
.sh h3{margin:0 0 4px;font-size:21px}
.sum{background:var(--stone);border-radius:12px;padding:12px 14px;margin:12px 0 4px;font-size:15px}
.sum div{display:flex;justify-content:space-between;gap:10px}.sum div+div{margin-top:4px}.sum .t{font-weight:700;font-size:17px;border-top:1px solid var(--line);padding-top:6px;margin-top:6px}
.f{margin-top:12px}.f label{display:block;font-size:14px;font-weight:600;margin-bottom:5px}
.f input,.f textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);padding:12px 14px;font-size:16px}
.f input:focus,.f textarea:focus{outline:none;border-color:var(--wine)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media (max-width:480px){.two{grid-template-columns:1fr}}
.note{font-size:13.5px;color:var(--muted);margin:12px 0 0}
.msg{min-height:1.3em;margin:10px 0 0;font-weight:600;color:#b42318}
.acts{display:flex;gap:10px;margin-top:14px}.acts .go{flex:1}
.ghost{border:1px solid var(--line);background:none;border-radius:12px;padding:12px 18px;font-weight:600;cursor:pointer}
.done{text-align:center;padding:10px 4px}.done .ok{width:56px;height:56px;border-radius:50%;background:var(--free-soft);color:var(--free);display:grid;place-items:center;margin:4px auto 12px;font-size:28px}
.closed{padding:80px 0;text-align:center}
.lay{list-style:none;margin:2px 0 8px;padding:0;font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 14px}.lay b{color:var(--ink,inherit);font-weight:600}
</style>
</head>

const minFor=d=>EsPrice.minStay({},d,D.pricing,{},D.min);
const minU=(u,d)=>EsPrice.minStay(u,d,D.pricing,u.rules||{},D.min);
const quoteU=(u,d,n)=>EsPrice.quote(u,d,n,OPT(u));
const totalU=(u,d,n)=>quoteU(u,d,n).total;
const fromP=u=>{const d=din||D.today||todayS();return EsPrice.night(u,d,D.pricing,u.rules||{})||+u.price};
const extras=u=>[+u.cfee>0?`+ ${money(+u.cfee,u.pcur)} ${t("cfee")}`:"",+u.dep>0?`${money(+u.dep,u.pcur)} ${t("dep")}`:""].filter(Boolean).join(" · ");
const free=(u,from,n)=>{const R=u.rules||{};for(let i=0;i<n;i++){const r=R[addD(from,i)];if(r&&r.x)return false}return EsPrice.free(u.busy,from,n,EsPrice.gap(u))};
const whyText=c=>{const w=t("why");if(c.why==="arrival_day")return w.arrival_day+(c.days||[]).map(x=>t("wd")[x]).join(", ");if(c.why==="lead")return w.lead.replace("{n}",c.lead);if(c.why==="max")return w.max.replace("{n}",c.max);if(c.why==="min")return t("minN")(c.min);if(c.why==="guests")return t("tooMany")(c.cap);return w[c.why]||t("busy")};
function nextFree(u,from,n){for(let i=1;i<=120;i++){const d=addD(from,i);if(EsPrice.check(u,d,n,OPT(u)).ok)return d}return ""}
function renderStatic(){document.documentElement.lang=L;document.querySelectorAll("[data-l]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.l===L)));
  document.querySelectorAll("[data-t]").forEach(el=>{const v=t(el.dataset.t);if(typeof v==="string")el.textContent=v});
  if(!D)return;$("name").textContent=D.name;document.title=D.name;$("intro").textContent=D.intro||"";
  $("contact").innerHTML=[D.phone?`<a href="tel:${esc(D.phone.replace(/[^+\d]/g,""))}">${esc(D.phone)}</a>`:"",D.phone?`<a href="https://wa.me/${esc(D.phone.replace(/\D/g,""))}" target="_blank" rel="noopener">WhatsApp</a>`:"",D.email?`<a href="mailto:${esc(D.email)}">${esc(D.email)}</a>`:""].join("");
  $("terms").hidden=!D.terms;$("terms-t").textContent=D.terms||""}
function facts(u){const p=[];if(u.bedrooms)p.push(u.bedrooms+" "+plural(+u.bedrooms,t("bedrooms")));
  const b=u.beds||{};const bl=Object.entries(b).filter(([,v])=>v>0).map(([k,v])=>v+" × "+(t("beds")[k]||k));if(bl.length)p.push(bl.join(", "));
  if(u.guests)p.push("≤ "+u.guests+" "+t("guestsL"));if(u.area)p.push(u.area+" "+t("m2"));return p.join(" · ")}
function render(){const nights=din&&dout?Math.round((toT(dout)-toT(din))/DAY):0,has=nights>0;
  $("gn").textContent=G;$("gm").disabled=G<=1;$("kn").textContent=K;$("km").disabled=K<=0;
  const rows=D.units.map(u=>{const ck=has?EsPrice.check(u,din,nights,OPT(u)):{ok:false};
    return {u,ok:has&&ck.ok,ck,isFree:has&&ck.why!=="taken",total:has?totalU(u,din,nights):0}});
  rows.sort((a,b)=>(b.ok-a.ok)||(fromP(a.u)-fromP(b.u)));
  const n=rows.filter(r=>r.ok).length;
  $("summary").textContent=!has?t("pick"):nights<minFor(din)?t("minN")(minFor(din)):n?t("found")(n)+" · "+fdm(din)+" — "+fdm(dout)+", "+nights+" "+plural(nights,t("night")):t("none");
  const start=has?din:todayS(),days=[...Array(14)].map((_,i)=>addD(start,i));
  $("list").innerHTML=rows.map(({u,ok,ck,isFree,total})=>{
    const strip=days.map(d=>{const busy=!free(u,d,1),sel=has&&d>=din&&d<dout;return `<i class="${busy?"b":""}${sel?" sel":""}" title="${fdm(d)} · ${busy?t("taken"):t("free")}">${new Date(d+"T00:00:00Z").getUTCDate()}</i>`}).join("");
    let why="";if(has&&!ok){if(ck.why==="guests"||ck.why==="min"||ck.why==="max")why=esc(whyText(ck));else{const nf=nextFree(u,din,nights);why=`${esc(whyText(ck))}${nf?` ${t("freeFrom")} ${fdm(nf)}. <button type="button" data-try="${esc(nf)}">${t("tryIt")}</button>`:""}`}}
    const am=(u.amen||[]).slice(0,7).map(k=>`<span>${esc(t("am")[k]||k)}</span>`).join("");
    const kind=[t("kind")[u.kind]||"",u.group||""].filter(Boolean).join(" · ");
    return `<article class="unit${has&&!ok?" off":""}">
      <div class="ph" data-ph="${esc(u.name)}">${esc(u.name)}</div>
      <div class="ub"><div class="uh"><h2>${esc(u.name)}</h2>${kind?`<span class="kind">${esc(kind)}</span>`:""}</div>
        ${facts(u)?`<p class="facts">${esc(facts(u))}</p>`:""}${u.addr?`<p class="facts">📍 ${esc(u.addr)} · <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(u.addr+", Chișinău")}" target="_blank" rel="noopener">${esc(t("onMap"))}</a></p>`:""}${(u.layout||[]).length?`<ul class="lay">${u.layout.map(r=>`<li><b>${esc(r.n||"")}</b> ${esc(Object.entries(r.b||{}).filter(([,v])=>v>0).map(([k,v])=>v+" × "+(t("beds")[k]||k)).join(", "))}</li>`).join("")}</ul>`:""}${am?`<div class="am">${am}</div>`:""}
        <div class="strip">${strip}</div>
        <div class="legend"><span><i style="background:var(--free-soft)"></i>${t("free")}</span><span><i style="background:var(--busy)"></i>${t("taken")}</span>${u.cin||u.cout?`<span>${t("cin")} ${esc(u.cin||"14:00")}, ${t("cout")} ${esc(u.cout||"12:00")}</span>`:""}</div>
        <div class="uf"><div class="price">${has&&ok?`<b>${money(total,u.pcur)}</b> <span>${t("total")}</span><small>${(()=>{const q=quoteU(u,din,nights);return (q.flat?`${money(q.nights[0].p,u.pcur)} ${t("perNight")} × ${nights}`:`≈ ${money(q.avg,u.pcur)} ${t("perNight")} × ${nights}`)+(q.xg?` + ${money(q.xg,u.pcur)} ${t("xg")}`:"")+(q.xc?` + ${money(q.xc,u.pcur)} ${t("xc")}`:"")+(q.los?` − ${q.losPct}% ${t("los")}`:"")})()}${extras(u)?" "+extras(u):""}</small>`:`<span>${t("from")}</span> <b>${money(fromP(u),u.pcur)}</b> <span>${t("perNight")}</span>${extras(u)?`<small>${extras(u)}</small>`:""}`}</div>
          ${has&&ok?`<button type="button" class="go" data-book="${esc(u.name)}">${t("book")}</button>`:why?`<p class="why">${why}</p>`:""}</div></div></article>`}).join("")||`<div class="empty">${t("none")}</div>`;
  loadPhotos()}
// photos: one request per unit, only when its card is near the screen
const PH={};let io=null;
function loadPhotos(){const els=[...document.querySelectorAll("[data-ph]")];
  const put=el=>{const a=el.dataset.ph;if(PH[a]!==undefined){if(PH[a])el.innerHTML=`<img src="${PH[a]}" alt="${esc(a)}" loading="lazy">`;return}
    PH[a]=null;api("pub_photo",{apt:a}).then(r=>{PH[a]=r.data||"";document.querySelectorAll(`[data-ph="${CSS.escape(a)}"]`).forEach(put)}).catch(()=>{PH[a]=""})};
  if(!("IntersectionObserver" in window)){els.forEach(put);return}
  io&&io.disconnect();io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);put(e.target)}}),{rootMargin:"300px"});els.forEach(el=>PH[el.dataset.ph]?put(el):io.observe(el))}
function openReq(name){const u=D.units.find(x=>x.name===name);if(!u)return;const nights=Math.round((toT(dout)-toT(din))/DAY);
  const sh=$("sh");sh.innerHTML=`<h3 id="sh-h">${t("reqH")}</h3><div class="sum"><div><span>${esc(u.name)}</span><span>${fdm(din)} — ${fdm(dout)}</span></div><div><span>${t("guestsS")}: ${G}${K?` + ${K} ${t("kidsS")}`:""}</span><span>${nights} ${plural(nights,t("night"))}</span></div>${(()=>{const q=quoteU(u,din,nights),row=(k,v)=>`<div><span>${k}</span><span>${v}</span></div>`;return row(`${nights} ${plural(nights,t("night"))}`,money(q.base,u.pcur))+(q.xg?row(t("xg"),money(q.xg,u.pcur)):"")+(q.xc?row(t("xc"),money(q.xc,u.pcur)):"")+(q.los?row(`${t("los")} −${q.losPct}%`,"− "+money(q.los,u.pcur)):"")})()}${+u.cfee>0?`<div><span>${t("cfee")}</span><span>${money(+u.cfee,u.pcur)}</span></div>`:""}<div class="t"><span>${t("total")}</span><span>${money(totalU(u,din,nights),u.pcur)}</span></div>${+u.dep>0?`<div><span>${t("dep")}</span><span>${money(+u.dep,u.pcur)}</span></div>`:""}</div>
    <form id="rf" novalidate><div class="f"><label for="r-name">${t("yourName")}</label><input id="r-name" autocomplete="name" maxlength="80" required></div>
    <div class="two"><div class="f"><label for="r-phone">${t("phone")}</label><input id="r-phone" type="tel" autocomplete="tel" maxlength="40"></div><div class="f"><label for="r-email">${t("email")}</label><input id="r-email" type="email" autocomplete="email" maxlength="120"></div></div>
    <div class="f"><label for="r-msg">${t("msg")}</label><textarea id="r-msg" rows="2" maxlength="600"></textarea></div>
    <p class="note">${t("after")}</p><p class="msg" id="r-err" role="alert"></p>
    <div class="acts"><button type="button" class="ghost" data-close="1">${t("back")}</button><button class="go" id="r-go">${t("send")}</button></div></form>`;
  $("sheet").hidden=false;setTimeout(()=>$("r-name").focus(),50);
  $("rf").onsubmit=async e=>{e.preventDefault();const v={name:$("r-name").value.trim(),phone:$("r-phone").value.trim(),email:$("r-email").value.trim(),message:$("r-msg").value.trim()},err=$("r-err");
    if(!v.name||(!v.phone&&!v.email)){err.textContent=t("need");return}if(v.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.email)){err.textContent=t("badEmail");return}
    const b=$("r-go");b.disabled=true;try{await api("pub_request",{...v,apt:u.name,date:din,nights,guests:G,kids:K,lang:L});
      sh.innerHTML=`<div class="done"><div class="ok">✓</div><h3 id="sh-h">${t("doneH")}</h3><p>${esc(t("doneP")(D.name))}</p><div class="sum"><div><span>${esc(u.name)}</span><span>${fdm(din)} — ${fdm(dout)}</span></div></div><div class="acts"><button type="button" class="go" data-close="1">${t("close")}</button></div></div>`;
      u.busy=[...(u.busy||[]),[din,nights]];render()}
    catch(x){b.disabled=false;err.textContent=x.code==="bad_dates"&&x.data&&x.data.why?whyText(x.data):x.code==="taken"?t("takenErr"):x.code==="locked"?t("lock"):x.code==="too_many_guests"?t("tooMany")(x.data.cap):x.code==="need_contact"?t("need"):t("net");if(x.code==="taken")load()}}}
function closeSheet(){$("sheet").hidden=true}
document.addEventListener("click",e=>{const b=e.target.closest("[data-book],[data-try],[data-close],[data-l]");if(!b){if(e.target===$("sheet"))closeSheet();return}
  if(b.dataset.l){L=b.dataset.l;try{localStorage.setItem("es_book_lang",L)}catch(x){}renderStatic();if(D)render();return}
  if(b.dataset.close){closeSheet();return}
  if(b.dataset.try){const n=Math.round((toT(dout)-toT(din))/DAY);din=b.dataset.try;dout=addD(din,n);$("din").value=din;$("dout").value=dout;render();scrollTo({top:0,behavior:"smooth"});return}
  if(b.dataset.book)openReq(b.dataset.book)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("sheet").hidden)closeSheet()});
$("din").addEventListener("change",()=>{din=$("din").value;if(din&&(!dout||dout<=din)){dout=addD(din,D?minFor(din):1);$("dout").value=dout}$("dout").min=din?addD(din,1):"";render()});
$("dout").addEventListener("change",()=>{dout=$("dout").value;render()});
$("gm").onclick=()=>{G=Math.max(1,G-1);render()};$("gp").onclick=()=>{G=Math.min(30,G+1);render()};
$("km").onclick=()=>{K=Math.max(0,K-1);render()};$("kp").onclick=()=>{K=Math.min(20,K+1);render()};
async function load(){try{D=await api("pub_listing");renderStatic();const t0=todayS();$("din").min=t0;$("dout").min=addD(t0,1);render()}
  catch(x){$("name").textContent=x.data&&x.data.name||"";$("list").innerHTML=`<div class="closed"><p>${x.code==="closed"?t("closed"):t("notFound")}</p></div>`;document.querySelector(".search").hidden=true;renderStatic()}}
renderStatic();load();
</script>
</body>
</html>
