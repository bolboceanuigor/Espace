<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Raport lunar</title>
<meta name="theme-color" content="#1b2a2f">
<link rel="icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
/* An apartment owner's monthly statement: reads like a bank statement — one figure that matters (the payout), then the lines behind it. */
:root{--stone:#eef0ec;--paper:#ffffff;--ink:#1b2a2f;--muted:#66727a;--line:#dde1dc;--wine:#8a1f3d;--wine-soft:#f6e7ec;--plus:#2f7a4d;--minus:#a33a2c;--r:14px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--stone:#121a1d;--paper:#1a2428;--ink:#edf1ef;--muted:#9aa6ab;--line:#2a363b;--wine:#e0718f;--wine-soft:#3a1f28;--plus:#6fcf97;--minus:#f08a7a}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--stone);color:var(--ink);font:15.5px/1.55 "Golos Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}
.top{display:flex;align-items:center;gap:10px;padding:22px 0 0}
.brand{font-weight:700;font-size:14px;color:var(--muted)}
.lang{margin-left:auto;display:flex;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:none;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.print{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer}
h1{font-family:Unbounded,"Golos Text",sans-serif;font-weight:700;font-size:clamp(26px,5.4vw,40px);line-height:1.08;letter-spacing:-.02em;margin:26px 0 6px}
.sub{color:var(--muted);margin:0}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin-top:22px;overflow:hidden}
.pay{padding:22px 22px 18px;border-bottom:1px dashed var(--line)}
.pay small{display:block;font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--wine)}
.pay b{display:block;font-family:Unbounded,"Golos Text",sans-serif;font-size:clamp(34px,8vw,52px);letter-spacing:-.03em;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.pay span{color:var(--muted);font-size:14px}
.pay .paid{display:block;margin-top:8px;color:var(--plus);font-weight:600}
.sum{padding:8px 22px 14px}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .v{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.row.tot{border-top:2px solid var(--ink);border-bottom:0;margin-top:2px;padding-top:10px;font-weight:700}
.minus{color:var(--minus)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line)}
.stats div{background:var(--paper);padding:12px 14px}
.stats small{display:block;font-size:12px;color:var(--muted)}
.stats b{font-size:18px;font-variant-numeric:tabular-nums}
h2{font-size:17px;margin:30px 0 8px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
h2 span{font-size:13px;font-weight:500;color:var(--muted)}
table{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:14px}
td,th{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;font-weight:600;color:var(--muted);background:color-mix(in srgb,var(--stone) 50%,var(--paper))}
td.r,th.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.ex td{color:var(--minus)}
tr.t td{font-weight:700;border-bottom:0}
.note{color:var(--muted);font-size:13px;margin-top:22px}
.msg{padding:60px 0;text-align:center;color:var(--muted)}
@media (max-width:520px){.stats{grid-template-columns:1fr 1fr 1fr}.stats b{font-size:16px}td,th{padding:8px 8px}.src{display:none}}
@media print{body{background:#fff}.lang,.print{display:none}.sheet,table{border-color:#ccc}h2{break-after:avoid}table{break-inside:auto}tr{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="brand" id="co"></span><button type="button" class="print" id="pr"></button>
    <div class="lang" role="group" aria-label="Limba"><button type="button" data-l="ro">RO</button><button type="button" data-l="ru">RU</button><button type="button" data-l="en">EN</button></div></div>
  <main id="main"><div class="msg">…</div></main>
</div>
<script>
(function(){
const T={
  ro:{months:["ianuarie","februarie","martie","aprilie","mai","iunie","iulie","august","septembrie","octombrie","noiembrie","decembrie"],title:"Raport lunar",for:"pentru",pay:"De plată către proprietar",payNeg:"Proprietarul datorează",inc:"Venit din rezervări",fee:"Comisionul administratorului",exp:"Cheltuieli ale apartamentelor",expNo:"Cheltuieli (nu se scad)",total:"De plată",nights:"Nopți ocupate",occ:"Ocupare",adr:"Preț mediu pe noapte",units:"apartamente",unit:"apartament",date:"Data",stay:"Nopți",guest:"Oaspete",amount:"Suma",none:"Nicio rezervare în această lună",sum:"Total apartament",yearly:"1/12 din cheltuiala anuală",split:"din",print:"Tipărește / PDF",
    foot:(r,d)=>`Sume în euro, la cursul 1 € = ${r} lei. O rezervare care trece dintr-o lună în alta se împarte pe nopți. Actualizat ${d}.`,gone:"Raportul nu a fost găsit. Cereți un link nou administratorului.",n:"n.",paid:(a,d,m)=>`✓ Achitat ${a} pe ${d}, ${({bank:"prin transfer",cash:"în numerar",card:"pe card"})[m]||""}`},
  ru:{months:["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"],title:"Отчёт за месяц",for:"для",pay:"К выплате собственнику",payNeg:"Собственник должен",inc:"Доход от броней",fee:"Комиссия управляющего",exp:"Расходы квартир",expNo:"Расходы (не вычитаются)",total:"К выплате",nights:"Занято ночей",occ:"Загрузка",adr:"Средняя цена ночи",units:"квартир",unit:"квартира",date:"Дата",stay:"Ночей",guest:"Гость",amount:"Сумма",none:"В этом месяце броней нет",sum:"Итого по квартире",yearly:"1/12 годового расхода",split:"из",print:"Печать / PDF",
    foot:(r,d)=>`Суммы в евро, по курсу 1 € = ${r} лей. Бронь на стыке месяцев делится по ночам. Обновлено ${d}.`,gone:"Отчёт не найден. Попросите у управляющего новую ссылку.",n:"н.",paid:(a,d,m)=>`✓ Выплачено ${a} ${d}, ${({bank:"переводом",cash:"наличными",card:"на карту"})[m]||""}`},
  en:{months:["January","February","March","April","May","June","July","August","September","October","November","December"],title:"Monthly statement",for:"for",pay:"Payout to the owner",payNeg:"Owner owes",inc:"Income from bookings",fee:"Manager’s commission",exp:"Apartment expenses",expNo:"Expenses (not deducted)",total:"Payout",nights:"Nights booked",occ:"Occupancy",adr:"Average nightly rate",units:"apartments",unit:"apartment",date:"Date",stay:"Nights",guest:"Guest",amount:"Amount",none:"No bookings this month",sum:"Apartment total",yearly:"1/12 of a yearly expense",split:"of",print:"Print / PDF",
    foot:(r,d)=>`Amounts in euro, at 1 € = ${r} lei. A booking across two months is split by nights. Updated ${d}.`,gone:"Statement not found. Ask your manager for a new link.",n:"n.",paid:(a,d,m)=>`✓ Paid ${a} on ${d}, ${({bank:"by transfer",cash:"in cash",card:"to card"})[m]||""}`}};
// values stored in the company app in Russian (expense categories, sources)
const DATA={ro:{"Уборка":"Curățenie","Ремонт":"Reparație","Коммунальные":"Utilități","Бельё и химия":"Lenjerie și detergenți","Интернет и ТВ":"Internet și TV","Налоги":"Impozite","Комиссии":"Comisioane","Прочее":"Altele","Прямой":"Direct","Повторный":"Revenit","Квартира":"Apartament"},
  en:{"Уборка":"Cleaning","Ремонт":"Repairs","Коммунальные":"Utilities","Бельё и химия":"Linen and supplies","Интернет и ТВ":"Internet and TV","Налоги":"Taxes","Комиссии":"Fees","Прочее":"Other","Прямой":"Direct","Повторный":"Returning","Квартира":"Apartment"},ru:{}};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>(Math.round((+n||0)*100)/100).toLocaleString("ro-RO",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const dm=d=>d?d.slice(8,10)+"."+d.slice(5,7):"";
const tok=(location.pathname.match(/\/raport\/([a-f0-9]{32})/)||[])[1]||new URLSearchParams(location.search).get("t")||"";
let L=(document.cookie.match(/(?:^|;\s*)es_lang=(ro|ru|en)/)||[])[1]||(navigator.languages||[navigator.language||""]).map(x=>String(x).slice(0,2).toLowerCase()).map(x=>x==="mo"?"ro":x).find(x=>T[x])||"ro";
let R=null,err=false;
const tr=v=>(DATA[L]||{})[v]||v;
function render(){const t=T[L];document.documentElement.lang=L;$("pr").textContent=t.print;
  document.querySelectorAll("[data-l]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.l===L)));
  if(err){$("main").innerHTML=`<div class="msg">${esc(t.gone)}</div>`;return}
  if(!R)return;
  const D=R.data,X=D.tot||{},mi=+R.ym.slice(5,7)-1,y=R.ym.slice(0,4),units=D.units||[];
  document.title=`${t.title} · ${t.months[mi]} ${y} · ${R.company}`;$("co").textContent=R.company;
  const occ=X.days?Math.round(X.nights/X.days*100):0,adr=X.nights?X.inc/X.nights:0;
  let h=`<h1>${esc(t.title)}<br>${esc(t.months[mi])} ${y}</h1><p class="sub">${D.owner&&D.owner.name?esc(t.for)+" <b>"+esc(D.owner.name)+"</b> · ":""}${units.length} ${units.length===1?t.unit:t.units}: ${units.map(u=>esc(u.apt)).join(", ")}</p>
  <div class="sheet"><div class="pay"><small>${X.pay<0?t.payNeg:t.pay}</small><b>${money(Math.abs(X.pay))}</b>${R.paid?`<span class="paid">${esc(t.paid(money(R.paid.amount),R.paid.paid_on.slice(8,10)+"."+R.paid.paid_on.slice(5,7)+"."+R.paid.paid_on.slice(0,4),R.paid.method))}</span>`:""}</div>
    <div class="sum"><div class="row"><span>${t.inc}</span><span class="v">${money(X.inc)}</span></div>
      <div class="row"><span>${t.fee} · ${D.fee}%</span><span class="v minus">− ${money(X.fee)}</span></div>
      <div class="row"><span>${D.expDed?t.exp:t.expNo}</span><span class="v${D.expDed?" minus":""}">${D.expDed?"− ":""}${money(X.exp)}</span></div>
      <div class="row tot"><span>${t.total}</span><span class="v">${money(X.pay)}</span></div></div>
    <div class="stats"><div><small>${t.nights}</small><b>${X.nights} / ${X.days}</b></div><div><small>${t.occ}</small><b>${occ}%</b></div><div><small>${t.adr}</small><b>${money(adr)}</b></div></div></div>`;
  for(const u of units){
    h+=`<h2>${esc(u.apt)}<span>${u.nights}/${u.days} ${t.n} · ${u.days?Math.round(u.nights/u.days*100):0}%</span></h2><table><thead><tr><th>${t.date}</th><th>${t.stay}</th><th>${t.guest}</th><th class="r">${t.amount}</th></tr></thead><tbody>`;
    h+=(u.stays||[]).map(b=>`<tr><td>${dm(b.date)}</td><td>${b.n}${b.n!==b.nights?` <span style="color:var(--muted)">${t.split} ${b.nights}</span>`:""}</td><td>${esc(b.guest)}<span class="src">${b.source?" · "+esc(tr(b.source)):""}</span></td><td class="r">${money(b.amount)}</td></tr>`).join("")||`<tr><td colspan="4" style="color:var(--muted)">${t.none}</td></tr>`;
    h+=(u.exps||[]).map(e=>`<tr class="ex"><td>${dm(e.date)}</td><td colspan="2">${esc(tr(e.cat))}${e.note?" · "+esc(e.note):""}${e.yearly?` · ${t.yearly}`:""}</td><td class="r">− ${money(e.amount)}</td></tr>`).join("");
    h+=`<tr class="t"><td colspan="3">${t.sum}</td><td class="r">${money(u.inc-(D.expDed?u.exp:0))}</td></tr></tbody></table>`}
  const at=R.at?new Date(R.at).toLocaleDateString(L==="en"?"en-GB":L==="ru"?"ru-RU":"ro-RO"):"";
  h+=`<p class="note">${esc(t.foot(D.rate,at))}</p>`;
  $("main").innerHTML=h}
document.addEventListener("click",e=>{const b=e.target.closest("[data-l]");if(b){L=b.dataset.l;try{document.cookie="es_lang="+L+";path=/;max-age=31536000;samesite=lax"}catch(x){}render();return}
  if(e.target.id==="pr")window.print()});
render();
if(!tok){err=true;render()}
else fetch("/api/pub_owner_report",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({token:tok})}).then(r=>r.ok?r.json():Promise.reject()).then(j=>{R=j;render()}).catch(()=>{err=true;render()});
})();
</script>
</body>
</html>
