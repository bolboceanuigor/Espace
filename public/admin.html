<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#202248">
<title>Admin · espace.md</title>
<link rel="icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f9;--surface:#fff;--sunk:#f0f1f5;--ink:#14162e;--ink2:#4c5068;--mute:#868aa1;--line:#e4e6ee;--line2:#eef0f5;
  --navy:#202248;--accent:#2f3bb3;--key:#fed36a;--chart:#3f4bd0;--chart-soft:#c9cdf3;
  --ok:#1d7a3a;--ok-bg:#e5f4ea;--warn:#a15c00;--warn-bg:#fdf1dc;--bad:#b42318;--bad-bg:#fde7e4;--info:#2f3bb3;--info-bg:#e9ebfb;
  --r:10px;--side:236px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1017;--surface:#171923;--sunk:#1e2130;--ink:#eceef6;--ink2:#b7bacb;--mute:#8186a0;--line:#2a2d3d;--line2:#222533;
  --navy:#fed36a;--accent:#9aa3ff;--chart:#8c95ff;--chart-soft:#3a3f6e;
  --ok:#6fd38f;--ok-bg:#163222;--warn:#f0b65c;--warn-bg:#33270f;--bad:#ff8f80;--bad-bg:#3a1a16;--info:#9aa3ff;--info-bg:#1f2347;
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:22px;letter-spacing:-.02em;margin:0;font-weight:800}
h2{font-size:15px;margin:0;font-weight:700}
.mute{color:var(--mute)}.ink2{color:var(--ink2)}.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn.p{background:var(--navy);border-color:var(--navy);color:#fff}
@media (prefers-color-scheme:dark){.btn.p{color:#14162e}}
.btn.d{color:var(--bad)}.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--info-bg)}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin:10px 0 4px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:var(--ok-bg)}.pill.warn{color:var(--warn);background:var(--warn-bg)}.pill.bad{color:var(--bad);background:var(--bad-bg)}.pill.info{color:var(--info);background:var(--info-bg)}.pill.gray{color:var(--ink2);background:var(--sunk)}

/* layout */
#app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
[hidden]{display:none!important}
.side{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
.logo{display:flex;align-items:center;gap:9px;padding:6px 10px 16px;font-weight:800;font-size:16px}
.logo img{width:26px;height:26px}.logo small{font-weight:600;color:var(--mute);font-size:12px;margin-left:auto}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink2);font-weight:600;text-decoration:none}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--sunk);color:var(--ink)}
.nav a svg{width:17px;height:17px;flex:none}
.nav a .c{margin-left:auto;font-size:11.5px;background:var(--key);color:#14162e;border-radius:999px;padding:0 7px;font-weight:800}
.side .sp{flex:1}
.side .me{font-size:12.5px;color:var(--mute);padding:8px 10px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px}
.side .me button{margin-left:auto}
main{min-width:0}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);display:flex;align-items:center;gap:12px;padding:12px 28px;border-bottom:1px solid var(--line)}
.search{position:relative;flex:1;max-width:460px}
.search input{padding-left:32px;background:var(--surface)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--mute)}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:600 11px/1 "Onest";color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:3px 5px}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 16px 40px -20px rgba(20,22,46,.35);max-height:360px;overflow:auto;display:none}
.results.on{display:block}
.results a{display:flex;gap:10px;align-items:center;padding:9px 12px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line2)}
.results a:hover,.results a.sel{background:var(--sunk)}
.content{padding:24px 28px 80px;max-width:1280px}
.ph{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.ph .sp{flex:1}
.burger{display:none}

/* blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.panel>.hd{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line2)}
.panel>.hd .sp{flex:1}
.panel>.bd{padding:14px 16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-top:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{padding:16px 18px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.kpi:nth-child(4n){border-right:0}
.kpi:nth-last-child(-n+4){border-bottom:0}
.kpi .l{font-size:12.5px;color:var(--mute);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:14px;font-weight:600;color:var(--mute);margin-left:3px}
.kpi .s{font-size:12.5px;color:var(--ink2);margin-top:2px}
.up{color:var(--ok)}.down{color:var(--bad)}

/* bar chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12.5px;font-weight:600;padding:5px 9px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s}
.chart .tip.on{opacity:1}
.chart .head{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.chart .head b{font-size:22px;font-weight:800;letter-spacing:-.02em}

/* lists */
.att{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.att:last-child{border-bottom:0}
.att .m{flex:1;min-width:0}.att .m b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .m small{color:var(--mute)}
.ev{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.ev:last-child{border-bottom:0}
.ev time{color:var(--mute);white-space:nowrap;font-size:12.5px;min-width:74px}
.ev .k{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--mute)}
.ev .k.payment{background:var(--ok)}.ev .k.signup{background:var(--accent)}.ev .k.block,.ev .k.expired{background:var(--bad)}.ev .k.lead{background:var(--warn)}
.empty{color:var(--mute);padding:18px 0;text-align:center}

/* tables */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip .n{opacity:.6;margin-left:4px}
.tw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--mute);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0}
th.s{cursor:pointer;user-select:none}th.s:hover{color:var(--ink)}
th .ar{opacity:.7}
td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}tbody tr.click:hover td{background:var(--sunk)}
td.r,th.r{text-align:right}
td .sub{display:block;font-size:12.5px;color:var(--mute)}
.bar-mini{display:inline-block;height:6px;border-radius:3px;background:var(--chart);vertical-align:middle}

/* company page */
.crumb{font-size:13px;margin-bottom:6px}
.chead{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
.chead .ava{width:44px;height:44px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
@media (prefers-color-scheme:dark){.chead .ava{color:#14162e}}
.chead .m{flex:1;min-width:220px}
.chead .acts{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:600;color:var(--mute);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.facts div{padding:12px 16px;border-right:1px solid var(--line2)}.facts div:last-child{border-right:0}
.facts span{display:block;font-size:12px;color:var(--mute);font-weight:600}.facts b{font-size:17px;font-variant-numeric:tabular-nums}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.form .full{grid-column:1/-1}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
.msg{font-size:13px;font-weight:600}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}

/* leads board */
.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border-radius:12px;padding:10px;min-height:120px}
.col h3{font-size:13px;margin:2px 4px 10px;display:flex;gap:6px;align-items:center}
.col h3 .n{color:var(--mute);font-weight:600}
.lc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.lc:hover{border-color:var(--mute)}
.lc b{display:block}.lc small{color:var(--mute);display:block}
.lc .fu{font-size:12px;font-weight:700;margin-top:4px}

dialog{border:0;border-radius:14px;padding:22px;width:min(520px,calc(100vw - 24px));background:var(--surface);color:var(--ink);box-shadow:0 30px 80px -30px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(15,16,23,.45)}
dialog h2{font-size:18px;margin-bottom:4px}

#login{max-width:380px;margin:12vh auto 0;padding:28px}
#login img{width:44px;height:44px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

@media (max-width:1100px){.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}}
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:30;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 60px rgba(0,0,0,.25)}
  body.navon .side{transform:none}
  .burger{display:inline-flex}
  .top{padding:10px 14px}.content{padding:18px 14px 80px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(4n){border-right:1px solid var(--line2)}.kpi:nth-child(2n){border-right:0}
  .kpi:nth-last-child(-n+4){border-bottom:1px solid var(--line2)}.kpi:nth-last-child(-n+2){border-bottom:0}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}.facts div:nth-child(2n){border-right:0}.facts div{border-bottom:1px solid var(--line2)}
  .form{grid-template-columns:1fr}
  .search kbd{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* look: Mosaic-style (white cards with soft shadows, violet accent, Inter) */
:root{--bg:#f3f4f6;--surface:#fff;--sunk:#f9fafb;--ink:#1f2937;--ink2:#4b5563;--mute:#6b7280;--line:#e5e7eb;--line2:#f3f4f6;
  --navy:#111827;--accent:#7c3aed;--key:#8b5cf6;--chart:#8b5cf6;--chart-soft:#ddd6fe;--info:#7c3aed;--info-bg:#ede9fe;--ok:#047857;--ok-bg:#d1fae5;--bad:#dc2626;--bad-bg:#fee2e2;--warn:#b45309;--warn-bg:#fef3c7;--r:12px;--sh:0 1px 2px rgba(17,24,39,.05),0 1px 3px rgba(17,24,39,.04)}
@media (prefers-color-scheme:dark){:root{--bg:#111827;--surface:#1f2937;--sunk:#263244;--ink:#f3f4f6;--ink2:#d1d5db;--mute:#9ca3af;--line:#374151;--line2:#2b3646;
  --navy:#f3f4f6;--accent:#a78bfa;--key:#8b5cf6;--chart:#a78bfa;--chart-soft:#4c3d7a;--info:#c4b5fd;--info-bg:#2e2653;--sh:0 1px 2px rgba(0,0,0,.3)}}
.panel,.tw,.kpi,.facts,dialog,#login{border:0!important;box-shadow:var(--sh)}
.panel,.tw,.facts{border-radius:12px}
.panel>.hd{border-bottom:1px solid var(--line2)}
.panel>.hd h2{font-size:15px;font-weight:600;color:var(--ink)}
.kpis{background:none;border:0;gap:16px;overflow:visible}
.kpi{background:var(--surface);border-radius:12px;border:0!important;padding:18px 20px}
.kpi .l{text-transform:uppercase;letter-spacing:.04em;font-size:11.5px;color:var(--mute)}
.kpi .v{font-size:28px;font-weight:700;color:var(--ink)}
.side{border-right:0;box-shadow:1px 0 0 var(--line);padding:18px 12px}
.logo{font-weight:700}
.nav a{font-weight:500;color:var(--ink2);border-radius:10px;padding:9px 12px}
.nav a svg{color:var(--mute)}
.nav a[aria-current="page"]{background:linear-gradient(90deg,rgba(139,92,246,.14),rgba(139,92,246,.04));color:var(--ink)}
.nav a[aria-current="page"] svg{color:#8b5cf6}
.nav a .c{background:#8b5cf6;color:#fff}
.top{background:color-mix(in srgb,var(--surface) 85%,transparent);border-bottom:1px solid var(--line)}
.btn{border-radius:8px;border-color:var(--line);box-shadow:0 1px 1px rgba(17,24,39,.04);font-weight:500}
.btn.p{background:var(--navy);border-color:var(--navy);color:#fff}
@media (prefers-color-scheme:dark){.btn.p{color:#111827}}
th{text-transform:uppercase;letter-spacing:.04em;font-size:11px;background:var(--sunk);color:var(--mute)}
.tw th:first-child{border-top-left-radius:12px}.tw th:last-child{border-top-right-radius:12px}
.chip{font-weight:500}.chip[aria-pressed="true"]{background:#8b5cf6;border-color:#8b5cf6;color:#fff}
.tabs button[aria-selected="true"]{color:#7c3aed;border-bottom-color:#8b5cf6}
.col{background:color-mix(in srgb,var(--line) 55%,var(--bg))}
.lc{border:0;box-shadow:var(--sh)}
.chead .ava{background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff}
h1{font-weight:700}
.grid3 .facts{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3 .facts div:nth-child(2n){border-right:0}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
</style>
</head>
<body>
<div id="login" class="panel" hidden>
  <img src="/icon-192.png" alt="">
  <h1 style="margin-top:10px">Admin espace.md</h1>
  <p class="mute" style="margin:4px 0 14px">Doar pentru administratorul platformei.</p>
  <form id="lf"><label class="f" for="em">Email</label><input id="em" type="email" autocomplete="email" required>
  <label class="f" for="pw">Parolă</label><input id="pw" type="password" autocomplete="current-password" required>
  <p class="msg bad" id="lmsg" role="alert"></p><button class="btn p" style="width:100%;justify-content:center;padding:10px">Intră</button>
  <div id="l-google-wrap" hidden><p class="mute" style="text-align:center;margin:14px 0 8px">sau</p>
  <button class="btn" type="button" id="l-google" style="width:100%;justify-content:center">Continuă cu Google</button></div>
  <p style="text-align:center;margin:12px 0 0"><a href="#" id="forgot">Am uitat parola</a></p></form>
  <form id="rf" hidden><label class="f" for="npw">Parolă nouă (minimum 8 caractere)</label><input id="npw" type="password" autocomplete="new-password" required>
  <p class="msg bad" id="rmsg" role="alert"></p><button class="btn p" style="width:100%;justify-content:center;padding:10px">Salvează parola</button></form>
</div>

<div id="app" hidden>
  <aside class="side" id="side">
    <div class="logo"><img src="/icon-192.png" alt="">espace.md<small>admin</small></div>
    <nav class="nav" id="nav" aria-label="Secțiuni"></nav>
    <div class="sp"></div>
    <div class="me"><span id="me-email"></span><button class="btn sm" id="out">Ieși</button></div>
  </aside>
  <main>
    <div class="top">
      <button class="btn burger" id="burger" aria-label="Meniu"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" placeholder="Caută companie, email, telefon, factură…" autocomplete="off" aria-label="Căutare"><kbd>⌘K</kbd><div class="results" id="results"></div></div>
      <a class="btn" href="https://espace.md/" target="_blank" rel="noopener" id="site-link">Site</a>
      <button class="btn p" id="new-org">Companie nouă</button>
    </div>
    <div class="content" id="view"></div>
  </main>
</div>

<dialog id="dlg"><form method="dialog" id="dlg-f"></form></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const fd=d=>d?d.slice(8,10)+"."+d.slice(5,7)+"."+d.slice(0,4):"—";
const lei=n=>(n==null?"—":Math.round(n).toLocaleString("ro-MD").replace(/ |\s/g," ")+" lei");
const lei2=n=>(n==null?"—":(Math.round(n*100)/100).toLocaleString("ro-MD",{minimumFractionDigits:2,maximumFractionDigits:2}).replace(/\s/g," ")+" lei");
const nf=n=>Math.round(n||0).toLocaleString("ro-MD").replace(/ |\s/g," ");
const MON=["ian","feb","mar","apr","mai","iun","iul","aug","sep","oct","noi","dec"];
const mon=ym=>MON[+ym.slice(5,7)-1]+(ym.slice(5,7)==="01"?" "+ym.slice(2,4):"");

/* bar chart — one series, one hue; hover shows the value */
function bars(id,labels,values,{fmt=v=>v,h=150}={}){
  const W=600,H=h,pad=22,n=values.length,max=Math.max(1,...values),bw=(W-8)/n,gap=Math.min(10,bw*.28);
  let s=`<svg viewBox="0 0 ${W} ${H+pad}" role="img" aria-label="grafic">`;
  for(let g=1;g<=3;g++){const y=H-H*g/3;s+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line2)" stroke-width="1"/>`}
  values.forEach((v,i)=>{const bh=v?Math.max(3,H*v/max):0,x=4+i*bw+gap/2,w=bw-gap,y=H-bh,last=i===n-1;
    s+=`<g data-i="${i}"><rect x="${x-gap/2}" y="0" width="${bw}" height="${H+pad}" fill="transparent"/>`;
    if(bh)s+=`<path d="M${x},${H} V${y+4} q0,-4 4,-4 h${w-8} q4,0 4,4 V${H} z" fill="${last?"var(--chart)":"var(--chart-soft)"}"/>`;
    else s+=`<line x1="${x}" x2="${x+w}" y1="${H-.5}" y2="${H-.5}" stroke="var(--line)" stroke-width="2"/>`;
    if(n<=12||i%2===n%2)s+=`<text x="${x+w/2}" y="${H+16}" text-anchor="middle" font-size="11.5" fill="var(--mute)">${esc(labels[i])}</text>`;s+="</g>"});
  s+=`<line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="var(--line)" stroke-width="1"/></svg><div class="tip" id="${id}-tip"></div>`;
  setTimeout(()=>{const el=$(id);if(!el)return;const tip=$(id+"-tip");
    el.querySelectorAll("g[data-i]").forEach(g=>{const i=+g.dataset.i;const show=()=>{const r=g.getBoundingClientRect(),p=el.getBoundingClientRect();tip.textContent=labels[i]+": "+fmt(values[i]);tip.style.left=(r.left-p.left+r.width/2)+"px";tip.style.top=(r.top-p.top+H*(1-values[i]/max)*(r.height/(H+pad)))+"px";tip.classList.add("on")};
      g.addEventListener("mouseenter",show);g.addEventListener("touchstart",show,{passive:true});g.addEventListener("mouseleave",()=>tip.classList.remove("on"))})},0);
  return `<div class="chart" id="${id}">${s}</div>`}

function csv(name,rows){const q=v=>{v=v==null?"":String(v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const b=new Blob(["﻿"+rows.map(r=>r.map(q).join(";")).join("\n")],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}

function invTable(list,withOrg){if(!list.length)return '<div class="empty">Încă nu sunt facturi.</div>';const t=today();
  return `<div class="tw" style="border:0;border-radius:0"><table><thead><tr><th>Număr</th>${withOrg?"<th>Companie</th>":""}<th>Emisă</th><th>Scadența</th><th>Perioada</th><th class="r">Suma</th><th>Stare</th><th></th></tr></thead><tbody>${list.map(i=>{const st=i.status==="paid"?pill("ok","Achitată"):i.status==="void"?pill("gray","Anulată"):i.due_at<t?pill("bad","Întârziată"):pill("warn","Trimisă");
    return `<tr><td><a href="/f/${esc(i.token)}" target="_blank" rel="noopener"><b>${esc(i.number)}</b></a></td>${withOrg?`<td><a href="#company/${esc(i.org_id)}">${esc(i.org_name||"")}</a></td>`:""}<td class="num">${fd(i.issued_at)}</td><td class="num">${fd(i.due_at)}</td><td class="num">${fd(i.period_from)} – ${fd(i.period_to)}</td><td class="r num">${lei(i.amount)}</td><td>${st}</td>
      <td class="r">${i.status==="sent"?`<button class="btn sm" data-act="inv-paid" data-id="${esc(i.id)}" data-org="${esc(i.org_id||"")}">Achitată</button> <button class="btn sm" data-act="inv-copy" data-token="${esc(i.token)}">Link</button> <button class="btn sm d" data-act="inv-void" data-id="${esc(i.id)}" data-org="${esc(i.org_id||"")}">Anulează</button>`:`<button class="btn sm" data-act="inv-copy" data-token="${esc(i.token)}">Link</button>`}</td></tr>`}).join("")}</tbody></table></div>`}
function payTable(list,withOrg){if(!list.length)return '<div class="empty">Încă nu sunt plăți.</div>';
  return `<div class="tw" style="border:0;border-radius:0"><table><thead><tr><th>Data</th>${withOrg?"<th>Companie</th>":""}<th class="r">Suma</th><th class="r">Sold după</th><th>Metodă</th><th>Notă</th></tr></thead><tbody>${list.map(p=>`<tr><td class="num">${fd(p.created_at.slice(0,10))}</td>${withOrg?`<td><a href="#company/${esc(p.org_id)}">${esc(p.org_name||"")}</a></td>`:""}<td class="r num"><b>${lei(p.amount)}</b></td><td class="r num">${p.balance_after!=null?lei2(p.balance_after):p.paid_until?"până "+fd(p.paid_until):""}</td><td>${p.method==="bonus"?pill("info","Bonus"):p.method==="corectie"?pill("warn","Corecție"):esc(p.method||"")}</td><td class="ink2" style="white-space:normal">${esc(p.note||"")}</td></tr>`).join("")}</tbody></table></div>`}

/* users: every account, across companies */
let UF={f:"all",q:""},USERS=null;
const ROLES={owner:"Proprietar",manager:"Manager",checker:"Verificare plăți",viewer:"Vizualizare",prop:"Proprietar de apartament"};
V.users=async()=>{USERS=await api("sa_users");renderNav();

  const d30=new Date(Date.now()-30*864e5).toISOString();
  const pass=(u,f)=>f==="all"||(f==="nopw"?!u.has_pw:f==="off"?!!u.disabled:f==="orphan"?!u.orgs.length:(u.last_login||"")>=d30);
  $("view").innerHTML=`<div class="ph"><div><h1>Utilizatori</h1><div class="mute">toate conturile, în toate companiile · ${USERS.length}</div></div><span class="sp"></span><button class="btn" id="csv-users">Export CSV</button></div>
  <div class="toolbar"><div class="chips">${CH.map(([k,l])=>`<button class="chip" data-uf="${k}" aria-pressed="${UF.f===k}">${l}<span class="n">${USERS.filter(u=>pass(u,k)).length}</span></button>`).join("")}</div><span style="flex:1"></span><input id="uq" placeholder="Nume, email, companie…" value="${esc(UF.q)}" style="max-width:240px"></div>
  <div class="tw"><table><thead><tr><th>Om</th><th>Companii și rol</th><th>Parolă</th><th>Ultimul login</th><th class="r">Sesiuni</th><th>Creat</th><th></th></tr></thead><tbody id="u-rows"></tbody></table></div>
  <p class="mute">„Suspendă” oprește intrarea în toate companiile și închide sesiunile deschise; datele rămân. Menajerele intră cu PIN și nu apar aici.</p>`;
  const rows=()=>{const q=UF.q.toLowerCase().trim();let L=USERS.filter(u=>pass(u,UF.f));if(q)L=L.filter(u=>[u.name,u.email,...u.orgs.map(o=>o.name+" "+o.code)].join(" ").toLowerCase().includes(q));
    $("u-rows").innerHTML=L.length?L.map(u=>`<tr><td><b>${esc(u.name||"—")}</b>${u.super?" "+pill("info","Admin"):""}${u.disabled?" "+pill("bad","Suspendat"):""}<span class="sub"><a href="mailto:${esc(u.email)}">${esc(u.email)}</a></span></td>

    const id=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,12));let r,sent=0,failed=0;
    try{do{r=await api("sa_broadcast",{id,segment:seg,subject:sub,text:ro,text_ru:ru});sent+=r.sent;failed+=r.failed;m.textContent="Trimise "+sent+" din "+r.total+"…"}while(r.remaining>0);
      m.className="msg ok";m.textContent="Gata: "+sent+" trimise"+(failed?", "+failed+" cu eroare (vezi Emailuri)":"")+".";toast("Mesajul a plecat")}catch(e){m.className="msg bad";m.textContent=errText(e)}return}
  if(a==="lead-add")return dialog(`<h2>Cerere nouă</h2><div class="form"><div><label class="f">Nume</label><input id="l-name" required></div><div><label class="f">Telefon</label><input id="l-phone" type="tel"></div>
    <div><label class="f">Email</label><input id="l-email" type="email"></div><div><label class="f">Apartamente</label><input id="l-apts"></div><div class="full"><label class="f">Notă</label><textarea id="l-note" rows="2"></textarea></div><div><label class="f">De revenit la</label><input id="l-fu" type="date"></div></div>`,
    async()=>{await api("sa_lead_add",{name:val("l-name"),phone:val("l-phone"),email:val("l-email"),apts:val("l-apts"),note:val("l-note"),follow_up:val("l-fu")});OV=null;reloadView()});
  if(a==="ann-save"){try{await api("sa_ann_save",{text:val("an-text"),level:val("an-level"),ends:val("an-ends")});toast("Anunțul e publicat");reloadView()}catch(e){$("an-msg").className="msg bad";$("an-msg").textContent=errText(e)}return}
  if(a==="ann-off"){await api("sa_ann_save",{id:ds.id,text:ds.text,level:ds.level,ends:ds.ends,active:false});return reloadView()}
  if(a==="ann-del"){if(!confirm("Ștergi anunțul?"))return;await api("sa_ann_delete",{id:ds.id});return reloadView()}
  if(a==="save-settings"){const b={vat:$("s-vat").checked,vat_rate:+val("s-vat_rate"),apt_rate:+val("s-apt_rate")||1};for(const k of ["name","idno","vat_code","address","bank","bic","iban","email","phone","prefix","due_days","footer"])b[k]=k==="due_days"?+val("s-"+k):val("s-"+k);
    try{await api("sa_settings_save",b);$("set-msg").className="msg ok";$("set-msg").textContent="Salvat"}catch(e){$("set-msg").className="msg bad";$("set-msg").textContent=errText(e)}return}
}
function leadDialog(id){const x=LEADS.find(l=>l.id===id);if(!x)return;
  dialog(`<h2>${esc(x.name)}</h2><p class="ink2" style="margin:0">${x.phone?`<a href="tel:${esc(x.phone)}">${esc(x.phone)}</a> · <a href="https://t.me/${esc(x.phone.replace(/[^\d+]/g,""))}" target="_blank" rel="noopener">Telegram</a> · <a href="viber://chat?number=${encodeURIComponent(x.phone.replace(/[^\d+]/g,""))}">Viber</a>`:""}${x.email?` · <a href="mailto:${esc(x.email)}">${esc(x.email)}</a>`:""}</p>
    <p class="mute" style="margin:4px 0 0">${fd(x.created_at.slice(0,10))}${x.apts?" · "+esc(x.apts)+" apartamente":""}${x.lang?" · "+esc(x.lang.toUpperCase()):""}</p>
    ${x.message?`<p style="background:var(--sunk);border-radius:8px;padding:8px 10px;white-space:pre-wrap">${esc(x.message)}</p>`:""}
    <div class="form"><div><label class="f">Etapă</label><select id="ld-st">${LS.map(([k,l])=>`<option value="${k}"${(x.status==="done"?"won":x.status)===k?" selected":""}>${l}</option>`).join("")}</select></div><div><label class="f">De revenit la</label><input id="ld-fu" type="date" value="${esc(x.follow_up||"")}"></div>
    <div class="full"><label class="f">Notițe</label><textarea id="ld-note" rows="3">${esc(x.note||"")}</textarea></div></div>
    ${x.org_id?`<p>Companie: <a href="#company/${esc(x.org_id)}">${esc(x.org_name||"deschide")}</a></p>`:`<p><button type="button" class="btn sm" data-act="new-org" data-lead="${esc(x.id)}">Creează compania pentru acest client</button></p>`}`,
    async()=>{await api("sa_lead",{id,status:val("ld-st"),follow_up:val("ld-fu"),note:$("ld-note").value});OV=null;reloadView()})}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act],[data-go],[data-f],[data-sort],[data-org],[data-tab],[data-lead],[data-evf],[data-uf]");if(!t)return;const ds=t.dataset;
  if(ds.uf){UF.f=ds.uf;V.users();return}
  if(ds.act){e.preventDefault();if($("dlg").open&&ds.act==="new-org")$("dlg").close();try{await act(ds.act,ds)}catch(err){toast(errText(err))}return}
  if(ds.go){if(ds.go.startsWith("#"))location.hash=ds.go;else{const [k,id]=ds.go.split(":");if(k==="org")location.hash="#company/"+id;else if(k==="inv")act("invoice",{id})}return}
  if(ds.f){F.state=ds.f;V.companies();return}
  if(ds.sort){F.dir=F.sort===ds.sort?-F.dir:(["name","state"].includes(ds.sort)?1:-1);F.sort=ds.sort;V.companies();return}
  if(ds.tab){TAB=ds.tab;V.company.show&&V.company.show();return}
  if(ds.evf){EVF=ds.evf;V.activity();return}
  if(ds.lead&&t.classList.contains("lc")){leadDialog(ds.lead);return}
  if(ds.org&&t.tagName==="TR"){location.hash="#company/"+ds.org;return}
});
$("new-org").onclick=()=>act("new-org",{});

/* global search: companies, emails, invoices, leads */
let SEL=-1,RES=[];
$("q").addEventListener("input",async()=>{const q=$("q").value.toLowerCase().trim();if(!q){$("results").classList.remove("on");return}
  if(!ORGS)await refresh("orgs");if(!LEADS)LEADS=await api("sa_leads").catch(()=>[]);if(!INV)INV=await api("sa_invoices").catch(()=>[]);
  RES=[...ORGS.filter(o=>[o.name,o.code,o.owner_email,o.owner_name].join(" ").toLowerCase().includes(q)).slice(0,6).map(o=>({h:"#company/"+o.id,t:o.name,s:o.code+".espace.md · "+o.owner_email,p:statePill(o)})),
    ...INV.filter(i=>i.number.toLowerCase().includes(q)).slice(0,3).map(i=>({h:"#company/"+i.org_id,t:"Factura "+i.number,s:(i.org_name||"")+" · "+lei(i.amount),p:""})),
    ...LEADS.filter(l=>[l.name,l.phone,l.email].join(" ").toLowerCase().includes(q)).slice(0,3).map(l=>({h:"#leads",t:l.name,s:"Cerere · "+(l.phone||l.email||""),p:""}))];
  SEL=RES.length?0:-1;$("results").innerHTML=RES.length?RES.map((r,i)=>`<a href="${r.h}" class="${i===SEL?"sel":""}"><span style="flex:1;min-width:0"><b>${esc(r.t)}</b><span class="sub mute" style="display:block;font-size:12.5px">${esc(r.s)}</span></span>${r.p}</a>`).join(""):'<div class="empty">Nimic găsit</div>';$("results").classList.add("on")});
$("q").addEventListener("keydown",e=>{const L=$("results").querySelectorAll("a");if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();SEL=(SEL+(e.key==="ArrowDown"?1:-1)+L.length)%Math.max(1,L.length);L.forEach((a,i)=>a.classList.toggle("sel",i===SEL))}
  if(e.key==="Enter"&&L[SEL]){location.hash=L[SEL].getAttribute("href");$("q").value="";$("results").classList.remove("on");$("q").blur()}if(e.key==="Escape"){$("q").value="";$("results").classList.remove("on");$("q").blur()}});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))$("results").classList.remove("on");if(e.target.closest(".results a")){$("q").value="";$("results").classList.remove("on")}});
document.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("q").focus()}});

/* ---------- routing & auth ---------- */
async function route(keep){const [r,id]=(location.hash.slice(1)||"overview").split("/");if(!keep)TAB=r==="company"&&TAB?TAB:"sum";
  try{if(r==="company"&&id)await V.company(id);else await (V[r]||V.overview)();if(!keep)scrollTo(0,0)}catch(e){if(e.code!=="bad_session")$("view").innerHTML=`<div class="empty">${esc(errText(e))}</div>`}}
addEventListener("hashchange",()=>{if(!location.hash.startsWith("#company"))TAB="sum";route(false)});
function showLogin(msg){$("app").hidden=true;$("login").hidden=false;$("lmsg").textContent=msg||"";
  fetch("/api/google_status",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"}).then(r=>r.ok?r.json():null).then(j=>{const w=$("l-google-wrap");if(w)w.hidden=!(j&&j.ok)}).catch(()=>{})}
$("l-google")&&($("l-google").onclick=()=>{location.href="/api/google/start?mode=login&next=admin"});
$("lf").addEventListener("submit",async e=>{e.preventDefault();$("lmsg").textContent="";
  try{const r=await fetch("/api/auth_login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("em").value.trim(),password:$("pw").value})});const j=await r.json();
    if(!r.ok){$("lmsg").textContent=j.message==="locked"?"Prea multe încercări — așteaptă 15 minute":"Email sau parolă greșită";return}
    TOK=j.token;try{localStorage.setItem("es_admin_tok",TOK)}catch(e){}if(!j.me.super){showLogin("Acest cont nu este administrator al platformei.");return}start(j.me)}catch(err){$("lmsg").textContent="Nu e legătură cu serverul"}});
$("forgot").onclick=async e=>{e.preventDefault();const em=$("em").value.trim();if(!em){$("lmsg").textContent="Scrie emailul mai sus, apoi apasă din nou.";return}
  const r=await fetch("/api/auth_reset_request",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:em,from:"admin"})});
  $("lmsg").className="msg "+(r.ok?"ok":"bad");$("lmsg").textContent=r.ok?"Dacă există contul, ți-am trimis un link pe email.":"Prea multe încercări — așteaptă 15 minute."};
let RT="";{const m=/[#&]reset=([0-9a-f]{64})/.exec(location.hash);if(m){RT=m[1];history.replaceState(null,"",location.pathname)}}
{const m=/[#&]t=([0-9a-f]{64})/.exec(location.hash);if(m){TOK=m[1];try{localStorage.setItem("es_admin_tok",TOK)}catch(e){}history.replaceState(null,"",location.pathname)}}
const GERR={denied:"Intrarea cu Google a fost anulată",verify:"Google nu a confirmat intrarea",no_account:"Nu există cont cu acest Google",not_admin:"Acest cont nu este administrator al platformei.",disabled:"Contul e suspendat",google_taken:"Acest Google e deja legat de alt cont",google_off:"Google încă nu e activ pe server",bad_state:"Sesiunea a expirat — încearcă din nou"};
let GERR_MSG="";{const m=/[#&]google_err=([^&]+)/.exec(location.hash);if(m){GERR_MSG=GERR[decodeURIComponent(m[1])]||"Nu am putut intra cu Google";history.replaceState(null,"",location.pathname)}}
$("rf").addEventListener("submit",async e=>{e.preventDefault();const r=await fetch("/api/auth_reset",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:RT,password:$("npw").value})});const j=await r.json().catch(()=>({}));
  if(!r.ok){if(j.message==="pw_too_short"){$("rmsg").textContent="Minimum 8 caractere.";return}
    RT="";$("rf").hidden=true;$("lf").hidden=false;$("lmsg").className="msg bad";
    $("lmsg").textContent=j.reason==="used"?"Acest link a fost deja folosit. Dacă ai cerut mai multe emailuri, deschide-l pe cel mai nou — sau scrie emailul și apasă din nou „Am uitat parola”.":"Linkul a expirat (e valabil 1 oră). Scrie emailul și apasă din nou „Am uitat parola”.";return}
  RT="";$("rf").hidden=true;$("lf").hidden=false;$("em").value=j.email||"";$("lmsg").className="msg ok";$("lmsg").textContent="Parola e schimbată. Intră cu parola nouă."});
$("out").onclick=async()=>{try{await api("auth_logout")}catch(e){}TOK="";try{localStorage.removeItem("es_admin_tok")}catch(e){}showLogin("")};
async function start(me){ME=me;$("login").hidden=true;$("app").hidden=false;$("me-email").textContent=me.user.email;renderNav();await route(false);if(!OV)refresh("ov").then(renderNav).catch(()=>{})}
if(RT){$("app").hidden=true;$("login").hidden=false;$("lf").hidden=true;$("rf").hidden=false}else if(TOK)api("auth_me").then(me=>me.super&&!me.support?start(me):showLogin("Acest cont nu este administrator al platformei.")).catch(()=>showLogin(""));else showLogin(GERR_MSG);
})();
</script>
