<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Disponibilitate</title>
<meta name="theme-color" content="#1b2a2f">
<link rel="icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--stone:#eef0ec;--paper:#fff;--ink:#1b2a2f;--muted:#66727a;--line:#dde1dc;--wine:#8a1f3d;--wine-ink:#fff;--free:#2f7a4d;--free-soft:#e3f1e8;--busy:#c9ced1;--r:12px}
@media (prefers-color-scheme:dark){:root{--stone:#121a1d;--paper:#1a2428;--ink:#edf1ef;--muted:#9aa6ab;--line:#2a363b;--wine:#e0718f;--wine-ink:#1a0d12;--free:#6fcf97;--free-soft:#1d3427;--busy:#3a4549}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--stone);color:var(--ink);font:14.5px/1.45 "Golos Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{padding:12px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.top b{font-size:16px;font-weight:700}
.top small{color:var(--muted);font-size:12.5px}
.unit{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-top:8px}
.uh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.uh h2{margin:0;font-size:15.5px;font-weight:700}
.uh .p{color:var(--muted);font-size:13px}.uh .p b{color:var(--ink);font-weight:700}
.strip{display:grid;grid-template-columns:repeat(21,1fr);gap:2px;margin-top:10px}
.strip i{height:22px;border-radius:4px;background:var(--free-soft);font-style:normal;font-size:9.5px;color:var(--free);font-weight:600;display:flex;align-items:flex-end;justify-content:center;padding-bottom:1px}
.strip i.b{background:var(--busy);color:transparent}
.leg{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin-top:6px}
.leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.go{display:inline-block;margin-top:10px;border:0;border-radius:10px;background:var(--wine);color:var(--wine-ink);font-weight:700;padding:9px 14px;font-size:14px;cursor:pointer}
.foot{margin-top:12px;text-align:center;font-size:11.5px;color:var(--muted)}
.foot a{border-bottom:1px solid var(--line)}
.err{padding:28px 14px;text-align:center;color:var(--muted)}
@media (max-width:360px){.strip{grid-template-columns:repeat(14,1fr)}.strip i:nth-child(n+15){display:none}}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="err">…</p></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const T={
 ro:{title:"Disponibilitate",free:"liber",taken:"ocupat",book:"Rezervă",from:"de la",night:"/ noapte",closed:"Rezervările nu sunt deschise.",none:"Niciun obiect de afișat.",foot:"Direct pe"},
 ru:{title:"Свободные даты",free:"свободно",taken:"занято",book:"Забронировать",from:"от",night:"/ ночь",closed:"Бронирование закрыто.",none:"Нет объектов.",foot:"Напрямую на"},
 en:{title:"Availability",free:"free",taken:"taken",book:"Book",from:"from",night:"/ night",closed:"Booking is closed.",none:"Nothing to show.",foot:"Direct on"}};
let L=(()=>{try{const s=new URLSearchParams(location.search).get("lang")||localStorage.getItem("es_widget_lang");if(T[s])return s}catch(e){}const n=(navigator.language||"").slice(0,2);return n==="ru"?"ru":n==="en"?"en":"ro"})();
const t=k=>T[L][k];
const CUR={EUR:"€",USD:"$",MDL:"lei"};
const money=(v,c)=>Math.round(+v||0)+"\u00a0"+(CUR[c]||"€");
const DAY=864e5,toT=d=>Date.parse(d+"T00:00:00Z"),fromT=x=>new Date(x).toISOString().slice(0,10),addD=(d,n)=>fromT(toT(d)+n*DAY);
const SLUG=(()=>{const h=location.hostname,m=/^([a-z0-9-]+)\.espace\.md$/.exec(h);if(m&&!["www","admin"].includes(m[1]))return m[1];return new URLSearchParams(location.search).get("c")||""})();
const APT=(()=>{try{return new URLSearchParams(location.search).get("u")||""}catch(e){return ""}})();
const N=(()=>{const n=+new URLSearchParams(location.search).get("d")||21;return Math.max(14,Math.min(42,n||21))})();
async function api(fn,body={}){const r=await fetch("/api/"+fn,{method:"POST",headers:{"Content-Type":"application/json",...(SLUG?{"X-Espace-Org":SLUG}:{})},body:JSON.stringify({slug:SLUG,...body})});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.message||"http"),{code:j.message||"http",data:j});return j}
function busySet(busy){const s=new Set();for(const [d,n] of busy||[])for(let i=0;i<n;i++)s.add(addD(d,i));return s}
function render(D){document.documentElement.lang=L;document.title=D.name+" · "+t("title");
  const days=[...Array(N)].map((_,i)=>addD(D.today,i));
  const units=D.units||[];
  $("app").innerHTML=`<div class="top"><b>${esc(D.name)}</b><small>${esc(t("title"))}</small></div>
    ${units.map(u=>{const bs=busySet(u.busy);const strip=days.map(d=>`<i class="${bs.has(d)?"b":""}" title="${d}">${new Date(d+"T00:00:00Z").getUTCDate()}</i>`).join("");
      return `<article class="unit"><div class="uh"><h2>${esc(u.name)}</h2>${u.price?`<span class="p">${t("from")} <b>${money(u.price,u.pcur)}</b> ${t("night")}</span>`:""}</div>
        <div class="strip">${strip}</div>
        <div class="leg"><span><i style="background:var(--free-soft)"></i>${t("free")}</span><span><i style="background:var(--busy)"></i>${t("taken")}</span></div>
        ${D.direct?`<a class="go" href="${esc(D.book)}" target="_top" rel="noopener">${t("book")}</a>`:""}</article>`}).join("")||`<p class="err">${t("none")}</p>`}
    <p class="foot">${t("foot")} <a href="${esc(D.book||"#")}" target="_top" rel="noopener">${esc(D.slug)}.espace.md</a></p>`}
async function load(){try{const D=await api("pub_widget",{apt:APT});render(D)}
  catch(x){$("app").innerHTML=`<p class="err">${esc(x.code==="closed"?t("closed"):t("none"))}</p>`}}
load();
</script>
</body>
</html>
