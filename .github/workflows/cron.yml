name: Reminders ping and uptime check
# every 5 minutes: due reminders, to-dos, the 8:00 summaries and daily emails for every company;
# plus a check that espace.md and the API answer — if not, a Telegram message to the owner.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping and check
        env:
          CRON_KEY: ${{ secrets.CRON_KEY }}
          APP_URL: ${{ vars.APP_URL || 'https://espace-3hh.pages.dev' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://espace.md' }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          alert() {
            echo "::warning::$1"
            if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
              curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" -d chat_id="$TG_CHAT" --data-urlencode text="⚠️ espace.md: $1" > /dev/null || true
            fi
          }
          FAIL=0
          if [ -n "$CRON_KEY" ]; then
            CODE=$(curl -s -o /tmp/cron.txt -w "%{http_code}" -m 25 -X POST "$APP_URL/api/cron" -H "content-type: application/json" -d "{\"key\":\"$CRON_KEY\"}") || CODE=000
            if [ "$CODE" != "200" ]; then alert "API nu răspunde corect (cod $CODE) — $APP_URL/api/cron"; FAIL=1; else cat /tmp/cron.txt; fi
          fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 20 "$SITE_URL/") || CODE=000
          if [ "$CODE" != "200" ]; then alert "Site-ul nu se deschide (cod $CODE) — $SITE_URL"; FAIL=1; fi
          exit $FAIL
