name: Reminders ping
# every 5 minutes: due reminders, to-dos and the 8:00 morning summary for every active company
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        env:
          CRON_KEY: ${{ secrets.CRON_KEY }}
          APP_URL: ${{ vars.APP_URL || 'https://espace-3hh.pages.dev' }}
        run: |
          if [ -z "$CRON_KEY" ]; then echo "CRON_KEY secret not set"; exit 0; fi
          curl -fsS -X POST "$APP_URL/api/cron" -H "content-type: application/json" -d "{\"key\":\"$CRON_KEY\"}"
