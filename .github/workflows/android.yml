name: Espace — aplicația de Android (APK)
# Construiește APK-ul din mobile/ (Capacitor) și îl pune la GitHub Releases (tag espace-android).
# Cheia de semnare se creează o singură dată, criptată cu CLOUDFLARE_API_TOKEN, și stă în repo
# (mobile/android-release.keystore.enc) — fără aceeași cheie telefoanele nu pot actualiza aplicația.
on:
  push:
    branches: [main]
    paths: ["mobile/**", "!mobile/**/*.md", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: espace-android
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    env:
      KS_PASS: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - name: Firebase (notificări Android), dacă e pus în Secrets
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: if [ -n "$GSJ" ]; then printf '%s' "$GSJ" > android/app/google-services.json; echo "google-services.json pus"; else echo "::notice::fără GOOGLE_SERVICES_JSON: APK-ul merge, dar fără notificări native"; fi
      - name: Capacitor sync
        run: npx cap sync android
      - name: Cheia de semnare
        run: |
          [ -n "$KS_PASS" ] || { echo "::error::lipsește CLOUDFLARE_API_TOKEN"; exit 1; }
          if [ -f android-release.keystore.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in android-release.keystore.enc -out "$RUNNER_TEMP/ks.jks" -pass env:KS_PASS
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/ks.jks" -alias espace -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass espaceapp -keypass espaceapp -dname "CN=Espace, O=Espace, C=MD"
            openssl enc -aes-256-cbc -pbkdf2 -salt -in "$RUNNER_TEMP/ks.jks" -out android-release.keystore.enc -pass env:KS_PASS
            git config user.name "github-actions"; git config user.email "actions@github.com"
            git add android-release.keystore.enc && git commit -m "Espace Android: cheia de semnare (criptată) [skip ci]" && git pull --rebase --autostash -q && git push -q
          fi
      - name: versionCode = numărul rulării
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode $((100 + ${{ github.run_number }}))/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Gradle assembleRelease
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon -q
      - name: Semnează APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -f -p 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          $BT/apksigner sign --ks "$RUNNER_TEMP/ks.jks" --ks-pass pass:espaceapp --key-pass pass:espaceapp --ks-key-alias espace \
            --out "$RUNNER_TEMP/Espace.apk" "$RUNNER_TEMP/aligned.apk"
          $BT/apksigner verify "$RUNNER_TEMP/Espace.apk"
          ls -la "$RUNNER_TEMP/Espace.apk"
      - name: Publică la Releases
        run: |
          gh release view espace-android >/dev/null 2>&1 || gh release create espace-android --title "Espace Android" --notes "Ultimul APK Espace."
          gh release upload espace-android "$RUNNER_TEMP/Espace.apk" --clobber
          gh release edit espace-android --notes "Espace (build ${{ github.run_number }}) — descarcă Espace.apk de mai jos și instalează-l pe telefon."
          echo "### APK gata: https://github.com/${{ github.repository }}/releases/tag/espace-android" >> "$GITHUB_STEP_SUMMARY"
