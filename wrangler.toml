name = "espace"
pages_build_output_dir = "public"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "espace"
# filled in by the first deploy (see README); a separate database from Rentwill
database_id = "00000000-0000-0000-0000-000000000000"

# Optional: booking file uploads (ID photos). Uncomment and create the bucket in Cloudflare, then bind it on the Pages project as FILES.
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "espace-files"
